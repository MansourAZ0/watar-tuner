name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  frontend:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate dependencies while repositories are private
        if: github.event.repository.private
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$DEPS_TOKEN" ]]; then
            echo "::error::DEPS_TOKEN is required to read the private music dependencies. Configure it in both Actions and Dependabot secrets; see .github/DEPENDENCY_ACCESS.md."
            exit 1
          fi
          git config --global url."https://x-access-token:${DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
      # @naghma/ui is a path dependency on a sibling checkout of naghma-core.
      - name: Fetch shared UI at its release tag
        run: git clone --depth 1 --branch v0.6.0 https://github.com/MansourAz0-org/naghma-core.git ../naghma-core
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install shared UI dependencies
        run: npm ci --prefix ../naghma-core/packages/naghma-ui
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build

  rust:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate dependencies while repositories are private
        if: github.event.repository.private
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$DEPS_TOKEN" ]]; then
            echo "::error::DEPS_TOKEN is required to read the private music dependencies. Configure it in both Actions and Dependabot secrets; see .github/DEPENDENCY_ACCESS.md."
            exit 1
          fi
          git config --global url."https://x-access-token:${DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: mkdir -p dist   # tauri::generate_context! expects frontendDist
      - working-directory: src-tauri
        run: cargo fmt --check
      - working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - working-directory: src-tauri
        run: cargo test --locked

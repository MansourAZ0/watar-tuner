name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # @naghma/ui is a path dependency on a sibling checkout of naghma-core.
      - name: Fetch naghma-core (for @naghma/ui)
        run: git clone --depth 1 --branch v0.2.0 "https://x-access-token:${{ secrets.DEPS_TOKEN || github.token }}@github.com/MansourAZ0/naghma-core" ../naghma-core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Library dependencies are private git repositories; DEPS_TOKEN needs
      # read access to them.
      - name: Authenticate git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.DEPS_TOKEN || github.token }}@github.com/".insteadOf "https://github.com/"
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: mkdir -p dist   # tauri::generate_context! expects frontendDist
      - working-directory: src-tauri
        run: cargo fmt --check
      - working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - working-directory: src-tauri
        run: cargo test --locked

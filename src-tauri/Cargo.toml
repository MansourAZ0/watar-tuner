[package]
name = "watar-tuner"
version = "0.1.0"
description = "Watar: a standalone quarter-tone oud tuner"
authors = ["Mansour Aziz"]
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MansourAz0-org/watar-tuner"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "watar_tuner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
naghma-core = { git = "https://github.com/MansourAz0-org/naghma-core", tag = "v0.6.0" }
naghma-audio = { git = "https://github.com/MansourAz0-org/naghma-core", tag = "v0.6.0" }

[dev-dependencies]
# Same address the pinned naghma-core release uses, so Cargo sees one pitchforge.
# GitHub redirects it to MansourAz0-org; switch it with the next naghma-core release.
pitchforge = { git = "https://github.com/MansourAZ0/pitchforge-rs", tag = "v0.1.1", features = ["signals"] }


# Dependencies are rarely debugged; skipping their debug info keeps dev
# builds several gigabytes smaller.
[profile.dev.package."*"]
debug = false

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
